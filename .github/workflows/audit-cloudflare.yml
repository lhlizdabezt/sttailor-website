name: Audit Cloudflare production (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Check audit safety contract
        run: node --test scripts/check-cloudflare-audit.mjs

      - name: Read production configuration
        run: node scripts/cloudflare-production-audit.mjs > cloudflare-audit.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report endpoint coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('cloudflare-audit.json', 'utf8'));
          const entries = Object.entries(report.coverage);
          const lines = entries.map(([name, result]) => `| ${name} | ${result.ok ? 'PASS' : 'UNVERIFIED'} | ${result.status} |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['## Cloudflare read-only audit', '', '| Endpoint | Coverage | HTTP status |', '| --- | --- | --- |', ...lines, '', 'No infrastructure settings or token permissions were changed.', ''].join('\n'));
          console.log(JSON.stringify(report, null, 2));
          assert.equal(entries.length, 9, 'Expected nine endpoint checks');
          assert.ok(entries.every(([, result]) => result.ok), 'Incomplete audit coverage; inspect permission or transport failures before claiming a full pass');
          NODE
